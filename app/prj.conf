CONFIG_GPIO=y
CONFIG_LOG=y

# USB vendor device (custom vendor USB with bulk endpoints)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_VREQ_SUPPORT=y
CONFIG_USBD_BOS_SUPPORT=y
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=n
CONFIG_CDC_ACM_SERIAL_VID=0x1234
CONFIG_CDC_ACM_SERIAL_PID=0x5678

# USB device stack logging (DEBUG level for troubleshooting)
CONFIG_USBD_LOG_LEVEL_DBG=y
